map_server:
  ros__parameters:
    use_sim_time: false
    # The standalone launch file overrides this with an absolute path.
    yaml_filename: ""
    topic_name: map
    frame_id: map

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased", "SmacHybrid", "SmacLattice"]
    GridBased:
      # This spelling is taken from the Nav2 Humble package installed on 109.
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.15
      use_astar: true
      allow_unknown: false
    SmacHybrid:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.15
      allow_unknown: false
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      # Nav2 recommends at least 4-5x Rmin; Rmin is fixed at 1.0 m here.
      analytic_expansion_max_length: 5.0
      minimum_turning_radius: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      smooth_path: true
    SmacLattice:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      tolerance: 0.15
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      # The lattice metadata also fixes the turning radius at 1.0 m.
      analytic_expansion_max_length: 5.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      # The full-SE(2) policy supports in-place yaw.  A neutral penalty keeps
      # a same-XY yaw goal from being replaced by a multi-meter driving loop.
      rotation_penalty: 1.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      # The standalone launch file overrides this with an absolute path.
      lattice_filepath: "nav2/lattice/g1_diff_5cm_1m.json"
      # Preserve the control-set kinematics and exact in-place rotation
      # segments; the generic smoother can shorten a transition below Rmin.
      smooth_path: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      resolution: 0.05
      track_unknown_space: false

      # height_scan covers 1.6 m x 1.0 m.  A 0.95 m circle is the
      # conservative yaw-independent enclosure:
      # sqrt((1.6 / 2)^2 + (1.0 / 2)^2) = 0.943 m.
      robot_radius: 0.95

      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 4.0
        # Must be greater than robot_radius.  Cells within robot_radius are
        # INSCRIBED_INFLATED_OBSTACLE (253); the remaining 0.15 m is a soft
        # planning margin.
        inflation_radius: 1.10
      always_send_full_costmap: true

nav2_global_goal_to_waypoints:
  ros__parameters:
    use_sim_time: false
    goal_topic: /goal_pose
    waypoints_topic: /waypoints_b
    remain_time_topic: /remain_time
    status_topic: /nav2_waypoint_status
    raw_path_topic: /nav2_global_path
    sampled_path_topic: /nav2_sampled_waypoints_path
    compute_path_action: /compute_path_to_pose
    costmap_topic: /global_costmap/costmap_raw
    odom_topic: /odom
    global_frame: map
    base_frame: base_link
    planner_profile: navfn_xy_legacy
    # Match the policy control rate. Geometry planning remains asynchronous;
    # this timer only transforms and publishes the persistent timed horizon.
    publish_rate: 50.0
    replan_period: 1.0
    replan_deviation: 0.30
    # XY profiles use the position/linear-speed conditions. Yaw profiles
    # additionally require yaw/angular-speed conditions for goal_hold_time.
    # Match the planners' 0.15 m endpoint tolerance, but always measure this
    # error against the real user goal rather than the returned path endpoint.
    goal_tolerance: 0.15
    goal_linear_speed_tolerance: 0.10
    goal_yaw_tolerance: 0.10
    goal_angular_speed_tolerance: 0.15
    goal_hold_time: 0.50
    # XY capture can latch only after entering goal_tolerance. Once latched,
    # this wider envelope absorbs small braking drift without a forward-only
    # return loop; leaving it causes a stopped safety replan, never false reach.
    goal_capture_release_tolerance: 0.30
    # A stopped reference may hand over to a pending path only after fresh
    # odometry confirms both linear and angular motion are quiet.
    handover_hold_time: 0.20
    # Stale/missing velocity never satisfies the goal condition.
    odom_timeout: 0.50
    # Only the latest consecutive pair is needed: one high pose-difference
    # spike is rejected, while two sustained faster samples respond promptly.
    odom_speed_filter_window: 2
    # global_costmap publishes at 2 Hz. Two missed updates invalidate the
    # collision contract and make the bridge generate a bounded stop horizon.
    costmap_timeout: 1.00
    num_waypoints: 5
    # The policy was trained on a persistent five-point world trajectory with
    # 0.5 s between absolute deadlines. remain_time is derived as deadline-now
    # and therefore counts down instead of being reset on every publication.
    waypoint_interval: 0.50

    # Conservative deployment limits inside the training envelope
    # (training max velocity 1.2 m/s, max acceleration 4.0 m/s^2).
    cruise_speed: 0.30
    max_acceleration: 0.80
    max_deceleration: 1.00
    terminal_deceleration: 1.00
    max_lateral_acceleration: 0.25
    # Zero disables deadline pacing for the unchanged legacy NavFn profile.
    max_tracking_urgency: 0.0
    max_yaw_rate: 0.80

    # The forward-only Smac path is curvature-continuous and can use a faster
    # profile without changing the legacy NavFn contract above.  The bridge
    # selects these values only for smac_hybrid_xy_forward at startup.
    smac_hybrid_cruise_speed: 0.80
    smac_hybrid_max_acceleration: 1.20
    # A 0.50 m/s^2 terminal profile stops an ideal 0.8 m/s trajectory in
    # 0.64 m and leaves explicit response/margin reserve in the mutable 2 s
    # horizon. Emergency/fault braking still uses max_deceleration above.
    smac_hybrid_terminal_deceleration: 0.50
    smac_hybrid_max_lateral_acceleration: 0.30
    # Bound distance(first waypoint)/remain_time without changing the five
    # targets or their 0.5 s spacing. Repeated pacing beyond the delay budget
    # falls back to bounded braking and replanning.
    # Optional experiment only; keep deadline pacing disabled by default.
    smac_hybrid_max_tracking_urgency: 0.0
    terminal_response_time: 0.20
    terminal_braking_margin: 0.10
    # Fresh odometry may report more than this and is never clipped. When
    # odometry is stale, assume at least the training/deployment speed bound;
    # do not reuse the lower tracking-urgency pacing parameter as a physical
    # velocity limit.
    emergency_speed_upper_bound: 1.20
    tracking_pacing_max_delay: 0.75
    integration_step: 0.02
    curvature_window: 0.15

    # Smac replans preserve the committed prefix and validate every remaining
    # target. An incompatible periodic refresh is discarded while the safe old
    # horizon continues; deviation/safety replans still cause bounded braking.
    # The legacy NavFn adoption behavior remains unchanged.
    replan_commit_time: 0.50
    replan_join_distance: 0.35
    replan_max_waypoint_shift: 0.30
    replan_max_heading_shift: 0.35
    transient_failure_timeout: 0.30
    # 253 is Nav2's INSCRIBED_INFLATED_OBSTACLE value.  With robot_radius
    # 0.95, checking center-line cells against 253 checks the sensor-sized
    # conservative robot envelope without double-inflating it.
    collision_cost_threshold: 253
    unknown_is_collision: true
    hold_goal: true

lifecycle_manager_global_planning:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "planner_server"]
    bond_timeout: 4.0
